name: S19 prior-session candidates and live VWAP alerts

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions cron is UTC: 00:45 UTC = 08:45 Beijing.
    - cron: "45 0 * * 1-5"

permissions:
  contents: read

concurrency:
  group: s19-live-alerts
  cancel-in-progress: false

jobs:
  signal:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set Beijing trading date
        id: day
        env:
          TZ: Asia/Shanghai
        run: echo "date=$(date +%F)" >> "$GITHUB_OUTPUT"

      - name: Restore daily candidate and push state
        uses: actions/cache/restore@v4
        with:
          path: |
            state/push_state.json
            state/signal_state.json
            state/premarket_candidates.json
          key: s19-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            s19-${{ steps.day.outputs.date }}-

      - name: Prepare previous-session watchlist and scan live quotes
        env:
          TZ: Asia/Shanghai
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
        run: python src/run_signal_continuous.py

      - name: Save daily candidate and push state
        if: always() && steps.day.outputs.date != ''
        uses: actions/cache/save@v4
        with:
          path: |
            state/push_state.json
            state/signal_state.json
            state/premarket_candidates.json
          key: s19-${{ steps.day.outputs.date }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Preserve candidate, scan, and delivery audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s19-review-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: warn
          path: |
            logs/signals/
            state/premarket_candidates.json
            state/signal_state.json
